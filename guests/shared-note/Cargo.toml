[package]
name = "shared-note"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
playbit-api = { path = "../../playbit-api", features = ["guest"] }

[dev-dependencies]
playbit-test-fixtures = { path = "../../playbit/test-fixtures", features = ["wasm"] }
playbit = { path = "../../playbit", default-features = false, features = ["app-host", "test-support"] }
serde_json = "1"
tempfile = "3"

[lints.rust]
unsafe_code = "warn"
