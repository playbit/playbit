[package]
name = "todo"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["rlib"]

[features]
# Ordinary-volume protocol tests compile a separate explicit Root guest.
fixture-root = []

[dependencies]
playbit-api = { path = "../../playbit-api", features = ["guest"] }

[dev-dependencies]
playbit-test-fixtures = { path = "../../playbit/test-fixtures", features = ["wasm"] }
playbit = { path = "../../playbit", default-features = false, features = ["app-host", "native-runtime", "test-support"] }
serde_json = "1"
tempfile = "3"

[lints.rust]
unsafe_code = "warn"
