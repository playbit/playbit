app_id = "audio-piano"
name = "Audio Piano"
build_cmd = "cargo build --target wasm32-unknown-unknown"
required_host_features = ["ui.input.v1", "audio.close", "audio.open.begin", "audio.open.take", "audio.sample-rate", "audio.set-volume", "sound.open.pcm", "sound.play", "sound.stop"]

[release]
build_cmd = "cargo build --release --target wasm32-unknown-unknown"
