[workspace]
resolver = "3"
members = ["playbit", "playbit/platform/macos/runtime", "playbit/trace", "playbit-api", "playbit/test-fixtures", "playbit/kvdb", "playbit/docdb", "guests/*", "vendor/gpui"]
default-members = ["playbit", "playbit-api", "playbit/kvdb", "playbit/docdb"]
# Private services have their own workspaces; non-Rust guests are not Cargo members.
exclude = ["service/ap", "guests/counter-ocaml", "guests/scorekeeper", "guests/touchline"]

[workspace.package]
version = "0.1.5-beta"
edition = "2024"
license = "BUSL-1.1"
repository = "https://github.com/playbit/playbit"

[profile.release]
lto = "thin"

[patch.crates-io]
gpui = { path = "vendor/gpui" }
accesskit_macos = { path = "vendor/accesskit_macos" }

[workspace.lints.rust]
unsafe_code = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "allow"

# Keep the host debuggable while its Wasm compiler runs at production speed.

[profile.dev.package.cranelift-assembler-x64]
opt-level = 3

[profile.dev.package.cranelift-assembler-x64-meta]
opt-level = 3

[profile.dev.package.cranelift-bforest]
opt-level = 3

[profile.dev.package.cranelift-bitset]
opt-level = 3

[profile.dev.package.cranelift-codegen]
