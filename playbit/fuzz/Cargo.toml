[package]
name = "playbit-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
serde_json = "1"
blake3 = "1"
arbitrary = { version = "1", features = ["derive"] }
kvdb = { path = "../kvdb" }
# Coverage instrumentation retains native SDK call sites; link their real C ABI implementations.
playbit = { path = "..", default-features = false, features = ["test-support", "native-runtime", "wasm-runtime", "network", "app-host"] }
playbit-api = { path = "../../playbit-api" }
# Exercise the actual trace decoder directly; no exporter or duplicate parser.
playbit-trace = { path = "../trace" }

[[bin]]
name = "trace_decode"
path = "fuzz_targets/trace_decode.rs"
test = false
doc = false
bench = false

# Stable workspace builds never build the libFuzzer harness.
[workspace]
members = ["."]

[[bin]]
name = "decode_view"
path = "fuzz_targets/decode_view.rs"
test = false
doc = false
